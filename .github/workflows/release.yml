name: Release Build Check

# Weekly release build check for TRACE: every Monday 00:00 UTC (08:00
# Beijing time) or manually via workflow_dispatch on main. Runs quality
# gates, signed release build, and trace-test rehearsal, retaining the
# build artifacts for 7 days without creating a GitHub Release or tag.
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-build-check
  cancel-in-progress: false

jobs:
  check:
    name: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: auto
      TRACE_QUIET: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan release version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./tools/release -plan

      - name: Run quality gates
        run: go run ./tools/check

  build:
    name: build
    needs: [check]
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: auto
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build, sign and rehearse the release
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go run ./tools/release

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.check.outputs.version }}
          path: |
            dist/trace/
            artifacts/release/
          retention-days: 7
          if-no-files-found: error
