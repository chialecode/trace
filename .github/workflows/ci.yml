name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: auto
      TRACE_QUIET: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run quality gates
        run: go run ./tools/check

      - name: Remote smoke (trace-server, fake rclone, no network)
        run: go run ./tools/smoke -server

      - name: Run race detector tests
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout 15m ./...
