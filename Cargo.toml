[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/contracts",
    "crates/core",
    "apps/daemon",
    "apps/desktop/src-tauri",
    "adapters/bilibili",
    "adapters/common",
    "adapters/douyin",
    "tests/e2e",
]
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["TRACE maintainers"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "fs",
    "process",
    "signal",
] }
tokio-util = { version = "0.7.19", features = ["rt"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
sha2 = "0.11.0"
md-5 = "0.11.0"
base64 = "0.22"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }
url = "2.5.8"
unicode-normalization = "0.1.24"
time = { version = "0.3.44", features = ["formatting", "parsing", "macros"] }
rand = "0.9"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_WinRT",
    "UI_Notifications",
    "Data_Xml_Dom",
] }
tauri = "2.11.6"
tauri-build = "2"

trace-domain = { path = "crates/domain" }
trace-contracts = { path = "crates/contracts" }
trace-core = { path = "crates/core" }
trace-site-support = { path = "adapters/common" }

[profile.release]
lto = "thin"

# Optimized offline measurement harness. Test transport is excluded from release.
[profile.measure]
inherits = "release"
debug-assertions = true
